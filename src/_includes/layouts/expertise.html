{% extends "layouts/base.html" %}
{% block content %}

<section class="section-block homeBlend" data-alt="light" style="background:linear-gradient(180deg, var(--surface-1, #061021) 0%, var(--surface-1, #061021) 100%) !important; color:#e2e8f0;">
  <div class="section-shell" style="position:relative; z-index:1;">
    <h1 class="heading-xl mb-sm">Our Customer Mission, is <span style="color:var(--brand);">Our Mission</span></h1>

    <ul class="kfE__missionGrid" role="list" style="margin:0; padding:0; list-style:none; display:grid; gap:clamp(12px, 2vw, 18px); grid-template-columns:repeat(4, minmax(0, 1fr));">
      <li class="kfE__missionItem">
        <figure class="kfE__missionCard" aria-label="Customer mission image 1" tabindex="0" style="margin:0; padding:0; border-radius:18px; overflow:hidden; position:relative; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid rgba(148,163,184,.22); box-shadow:0 18px 46px rgba(8,18,35,.45), inset 0 1px 0 rgba(255,255,255,.08); isolation:isolate;">
          <img src="https://i.chzbgr.com/full/9806065408/h2429468C/person" alt="Customer mission image" loading="lazy" decoding="async" style="display:block; width:100%; height:100%; aspect-ratio: 4 / 3; object-fit:cover; filter:none;" />
          <figcaption class="kfE__missionCaption">Manufacturing</figcaption>
          <div class="kfE__missionHover" aria-hidden="true"><div class="kfE__missionCopy"><h4>Manufacturing</h4><p>Keeping production running with reliable, secure IT.</p></div></div>
        </figure>
      </li>
      <li class="kfE__missionItem">
        <figure class="kfE__missionCard" aria-label="Customer mission image 2" tabindex="0" style="margin:0; padding:0; border-radius:18px; overflow:hidden; position:relative; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid rgba(148,163,184,.22); box-shadow:0 18px 46px rgba(8,18,35,.45), inset 0 1px 0 rgba(255,255,255,.08); isolation:isolate;">
          <img src="https://pacificsun.com/wp-content/uploads/2025/01/STAGE-MPS-NBB-2502-1536x924.jpg" alt="Customer mission image 2" loading="lazy" decoding="async" style="display:block; width:100%; height:100%; aspect-ratio: 4 / 3; object-fit:cover; filter:none;" />
          <figcaption class="kfE__missionCaption">Entertainment</figcaption>
          <div class="kfE__missionHover" aria-hidden="true"><div class="kfE__missionCopy"><h4>Entertainment</h4><p>Powering creativity with fast,<br>flexible infrastructure.</p></div></div>
        </figure>
      </li>
      <li class="kfE__missionItem">
        <figure class="kfE__missionCard" aria-label="Customer mission image 3" tabindex="0" style="margin:0; padding:0; border-radius:18px; overflow:hidden; position:relative; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid rgba(148,163,184,.22); box-shadow:0 18px 46px rgba(8,18,35,.45), inset 0 1px 0 rgba(255,255,255,.08); isolation:isolate;">
          <img src="https://www.datadec.es/hubfs/transelevador_automatiizado_almacen.jpg" alt="Customer mission image 3" loading="lazy" decoding="async" style="display:block; width:100%; height:100%; aspect-ratio: 4 / 3; object-fit:cover; filter:none;" />
          <figcaption class="kfE__missionCaption">Logistics</figcaption>
          <div class="kfE__missionHover" aria-hidden="true"><div class="kfE__missionCopy"><h4>Logistics</h4><p>Driving efficiency through<br>connected, real-time systems.</p></div></div>
        </figure>
      </li>
      <li class="kfE__missionItem">
        <figure class="kfE__missionCard" aria-label="Customer mission image 4" tabindex="0" style="margin:0; padding:0; border-radius:18px; overflow:hidden; position:relative; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid rgba(148,163,184,.22); box-shadow:0 18px 46px rgba(8,18,35,.45), inset 0 1px 0 rgba(255,255,255,.08); isolation:isolate;">
          <img src="https://static.vecteezy.com/system/resources/previews/003/669/905/large_2x/stock-chart-image-displayed-on-computer-screen-free-photo.jpg" alt="Customer mission image 4" loading="lazy" decoding="async" style="display:block; width:100%; height:100%; aspect-ratio: 4 / 3; object-fit:cover; filter:none;" />
          <figcaption class="kfE__missionCaption">Financial Services</figcaption>
          <div class="kfE__missionHover" aria-hidden="true"><div class="kfE__missionCopy"><h4>Financial Services</h4><p>Securing data and compliance<br>for customer trust.</p></div></div>
        </figure>
      </li>
      <li class="kfE__missionItem">
        <figure class="kfE__missionCard" aria-label="Customer mission image 5" tabindex="0" style="margin:0; padding:0; border-radius:18px; overflow:hidden; position:relative; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid rgba(148,163,184,.22); box-shadow:0 18px 46px rgba(8,18,35,.45), inset 0 1px 0 rgba(255,255,255,.08); isolation:isolate;">
          <img src="https://img.freepik.com/free-photo/group-multinational-busy-people-working-office_146671-15660.jpg?semt=ais_hybrid&w=740&q=80" alt="Customer mission image 5" loading="lazy" decoding="async" style="display:block; width:100%; height:100%; aspect-ratio: 4 / 3; object-fit:cover; filter:none;" />
          <figcaption class="kfE__missionCaption">B2B Services</figcaption>
          <div class="kfE__missionHover" aria-hidden="true"><div class="kfE__missionCopy"><h4>B2B Services</h4><p>Enabling growth with smart,<br>scalable IT solutions.</p></div></div>
        </figure>
      </li>
      <li class="kfE__missionItem">
        <figure class="kfE__missionCard" aria-label="Customer mission image 6" tabindex="0" style="margin:0; padding:0; border-radius:18px; overflow:hidden; position:relative; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid rgba(148,163,184,.22); box-shadow:0 18px 46px rgba(8,18,35,.45), inset 0 1px 0 rgba(255,255,255,.08); isolation:isolate;">
          <img src="https://media.licdn.com/dms/image/sync/v2/D5627AQG-jDBGurJWVw/articleshare-shrink_800/B56Zhwwr3_HkAI-/0/1754238468157?e=2147483647&v=beta&t=GHld5AVsONvLuFvEg-gPzR3Ryv5YWC__oBI08T8OZA8" alt="Customer mission image 6" loading="lazy" decoding="async" style="display:block; width:100%; height:100%; aspect-ratio: 4 / 3; object-fit:cover; filter:none;" />
          <figcaption class="kfE__missionCaption">Design<br>&amp; Construction</figcaption>
          <div class="kfE__missionHover" aria-hidden="true"><div class="kfE__missionCopy"><h4>Design &amp; Construction</h4><p>Connecting teams from office to jobsite with resilient tech.</p></div></div>
        </figure>
      </li>
      <li class="kfE__missionItem">
        <figure class="kfE__missionCard" aria-label="Customer mission image 7" tabindex="0" style="margin:0; padding:0; border-radius:18px; overflow:hidden; position:relative; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid rgba(148,163,184,.22); box-shadow:0 18px 46px rgba(8,18,35,.45), inset 0 1px 0 rgba(255,255,255,.08); isolation:isolate;">
          <img src="https://news.mit.edu/sites/default/files/images/202207/MIT-Healthcare-Technology-01.jpg" alt="Customer mission image 7" loading="lazy" decoding="async" style="display:block; width:100%; height:100%; aspect-ratio: 4 / 3; object-fit:cover; filter:none;" />
          <figcaption class="kfE__missionCaption">Healthcare</figcaption>
          <div class="kfE__missionHover" aria-hidden="true"><div class="kfE__missionCopy"><h4>Healthcare</h4><p>Protecting patients &amp; powering<br>care through secure IT.</p></div></div>
        </figure>
      </li>
      <li class="kfE__missionItem">
        <figure class="kfE__missionCard" aria-label="Customer mission image 8" tabindex="0" style="margin:0; padding:0; border-radius:18px; overflow:hidden; position:relative; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid rgba(148,163,184,.22); box-shadow:0 18px 46px rgba(8,18,35,.45), inset 0 1px 0 rgba(255,255,255,.08); isolation:isolate;">
          <img src="https://etedge-insights.com/wp-content/uploads/2025/01/shutterstock_2340932533.jpg" alt="Customer mission image 8" loading="lazy" decoding="async" style="display:block; width:100%; height:100%; aspect-ratio: 4 / 3; object-fit:cover; filter:none;" />
          <figcaption class="kfE__missionCaption">Legal Services</figcaption>
          <div class="kfE__missionHover" aria-hidden="true"><div class="kfE__missionCopy"><h4>Legal Services</h4><p>Defending client confidentiality<br>with dependable systems.</p></div></div>
        </figure>
      </li>
    </ul>

    <style>
      /* Mission styles reused (scoped to this page) */
      .kfE__missionCard::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:70%; z-index:1; pointer-events:none; background:linear-gradient(0deg, rgba(0,0,0,.97) 0%, rgba(0,0,0,.85) 40%, rgba(0,0,0,.55) 72%, rgba(0,0,0,.18) 88%, rgba(0,0,0,0) 100%); border-bottom-left-radius:inherit; border-bottom-right-radius:inherit; }
      .kfE__missionCard::before{ content:""; position:absolute; inset:0; z-index:3; pointer-events:none; background:rgba(0,0,0,.68); opacity:0; transition:opacity .25s ease; border-radius:inherit; }
      .kfE__missionCard:is(:hover,:focus-within)::before{ opacity:1; }
      .kfE__missionCaption{ position:absolute; left:12px; bottom:12px; z-index:4; margin:0; padding:0; font-weight:800; font-size:clamp(18px, 2.6vw, 24px); line-height:1.1; letter-spacing:-.01em; color:#ffffff; text-shadow: 0 2px 10px rgba(0,0,0,.75), 0 1px 3px rgba(0,0,0,.65); }
      .kfE__missionHover{ position:absolute; inset:0; display:flex; align-items:flex-end; padding:14px; z-index:5; opacity:0; transform:translateY(6px); transition:opacity .25s ease, transform .25s ease; }
      .kfE__missionCopy{ color:#fff; }
      .kfE__missionCopy h4{ margin:0 0 4px; font-weight:800; font-size:clamp(18px, 2.6vw, 24px); letter-spacing:-.01em; text-shadow:0 2px 10px rgba(0,0,0,.85); }
      .kfE__missionCopy p{ margin:0; font-weight:600; font-size:clamp(13px, 2vw, 16px); line-height:1.35; color:#e6edf5; text-shadow:0 2px 10px rgba(0,0,0,.85); }
      .kfE__missionCard:is(:hover,:focus-within) .kfE__missionHover{ opacity:1; transform:translateY(0); }
      .kfE__missionCard:is(:hover,:focus-within) .kfE__missionCaption{ opacity:0; }
      @media (max-width: 980px){ .kfE__missionGrid{ grid-template-columns:repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 560px){ .kfE__missionGrid{ grid-template-columns:1fr; } }
    </style>

  </div>
</section>
